<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miguel Pires Soeiro · Dados, IA e Arquitetura Empresarial</title>
  <meta name="description" content="Miguel Pires Soeiro — Arquiteto de Soluções Empresariais (Dados & IA). Percurso profissional e académico, artigos de opinião, intervenções políticas e publicações." />
  <meta property="og:title" content="Miguel Pires Soeiro" />
  <meta property="og:description" content="Dados, IA e arquitetura empresarial. Intervenção cívica em Vila Franca de Xira." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="#topo">MS</a>
    <nav>
      <a href="#opiniao">Opinião</a>
      <a href="#videos">Vídeos</a>
      <a href="#publicacoes">Publicações</a>
      <a href="#carreira">Carreira</a>
      <a href="#academico">Académico</a>
      <a href="#certificacoes">Certificações</a>
    </nav>
    <button id="tema" aria-label="Alternar tema claro/escuro">◐</button>
  </header>

  <main id="topo">
    <section class="hero">
      <p class="eyebrow" id="h-titulo"></p>
      <h1 id="h-nome"></h1>
      <p class="lead" id="h-resumo"></p>
      <p class="badge" id="h-ordem"></p>
      <div class="cta" id="h-links"></div>
    </section>

    <section id="opiniao">
      <h2>Artigos de opinião</h2>
      <div class="filters" id="f-opiniao"></div>
      <ul class="list" id="l-opiniao"></ul>
    </section>

    <section id="videos">
      <h2>Intervenções políticas</h2>
      <div class="cards" id="l-videos"></div>
    </section>

    <section id="publicacoes">
      <h2>Artigos académicos</h2>
      <ul class="list" id="l-academicos"></ul>
    </section>

    <section id="carreira">
      <h2>Percurso profissional</h2>
      <ol class="timeline" id="tl-carreira"></ol>
    </section>

    <section id="academico">
      <h2>Percurso académico</h2>
      <ol class="timeline" id="tl-academico"></ol>
    </section>

    <section id="certificacoes">
      <h2>Certificações</h2>
      <ol class="timeline" id="tl-certificacoes"></ol>
    </section>

  <footer>
    <span id="ano"></span> Miguel Pires Soeiro
  </footer>

  <script src="data.js"></script>
